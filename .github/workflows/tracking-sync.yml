# Shippo tracking sync — polls every in-transit shipment and auto-delivers.
# Runs server-side because Shippo's /tracks CORS preflight blocks the
# Authorization header, so the browser can never poll tracking itself.
#
# Requires the DATABASE_URL repository secret (Settings → Secrets and
# variables → Actions): the Neon connection string, same value as .env.local.
name: tracking-sync

on:
  schedule:
    # FALLBACK ONLY (every 6h, minute 7 — aligned with the other syncs so
    # one Neon compute wake serves all). The real cadence comes from
    # cron-job.org firing workflow_dispatch — GitHub's own scheduler
    # delays best-effort crons by hours, and each unaligned run woke the
    # Neon free-tier compute for a separate ~5-minute window.
    - cron: '7 */6 * * *'
  workflow_dispatch: {}

concurrency:
  group: tracking-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Poll Shippo and update shipment tracking
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun tools/sync-tracking.ts
