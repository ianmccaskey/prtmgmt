# Texts warehouses when an order is newly assigned to them, every 5
# minutes (GitHub's minimum schedule; actual latency is typically 5-15
# minutes). One SMS per (warehouse, order), deduped in sms_outbox.
# Delivery via AWS SNS.
#
# Secrets required:
#   DATABASE_URL           — Neon connection string (shared with other syncs)
#   AWS_ACCESS_KEY_ID      — IAM user with sns:Publish only
#   AWS_SECRET_ACCESS_KEY  — its secret key
#   AWS_REGION             — e.g. us-east-1 (optional; defaults to us-east-1)
#   SNS_ORIGINATION_NUMBER — optional; a provisioned toll-free/10DLC number.
#                            Omit while the account is in the SNS SMS sandbox.
name: sms-sync

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: sms-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install tool dependencies
        run: bun install --frozen-lockfile
      - name: Send assignment texts
        run: bun tools/sync-sms.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          SNS_ORIGINATION_NUMBER: ${{ secrets.SNS_ORIGINATION_NUMBER }}
