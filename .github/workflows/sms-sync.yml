# Pushes an ntfy notification to warehouses when an order is newly
# assigned to them, every 5 minutes (GitHub's minimum schedule; actual
# latency is typically 5-15 minutes). One push per (warehouse, order),
# deduped in sms_outbox. Delivery is ntfy (https://ntfy.sh) — no carrier
# registration, no credentials; the per-warehouse secret topic is the
# only key, and it lives in the warehouses table, not here.
#
# Secrets required:
#   DATABASE_URL — Neon connection string (shared with other syncs)
#   NTFY_SERVER  — optional; self-hosted ntfy base URL (default https://ntfy.sh)
name: sms-sync

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: sms-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Send assignment notifications
        run: bun tools/sync-sms.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
