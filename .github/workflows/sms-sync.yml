# Pushes an ntfy notification to warehouses when an order is newly
# assigned to them, every 15 minutes 6am–11pm CT via cron-job.org (actual
# latency is typically 5-20 minutes). One push per (warehouse, order),
# deduped in sms_outbox. Delivery is ntfy (https://ntfy.sh) — no carrier
# registration, no credentials; the per-warehouse secret topic is the
# only key, and it lives in the warehouses table, not here.
#
# Secrets required:
#   DATABASE_URL — Neon connection string (shared with other syncs)
#   NTFY_SERVER  — optional; self-hosted ntfy base URL (default https://ntfy.sh)
name: sms-sync

on:
  schedule:
    # FALLBACK ONLY — cron-job.org drives the real cadence (every 15 min,
    # 6am–11pm CT) via workflow_dispatch; see tracking-sync.yml for the
    # Neon-compute rationale. Aligned at minute 7 with the other syncs.
    - cron: '7 */6 * * *'
  workflow_dispatch: {}

concurrency:
  group: sms-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Send assignment notifications
        run: bun tools/sync-sms.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
